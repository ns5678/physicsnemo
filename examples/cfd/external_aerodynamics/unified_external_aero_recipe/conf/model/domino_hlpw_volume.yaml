# HLPW DoMINO volume template for the unified trainer.
input_type: tensors
output_type: tensors
precision: float16
compile: false
metrics: [l1, l2, mae]

forward_kwargs:
  data_dict:
    geometry_coordinates: boundaries.stl_geometry.points
    grid: global_data.grid
    sdf_grid: global_data.sdf_grid
    surf_grid: global_data.surf_grid
    sdf_surf_grid: global_data.sdf_surf_grid
    volume_mesh_centers: interior.points
    sdf_nodes: interior.point_data.sdf
    pos_volume_closest: interior.point_data.pos_volume_closest
    pos_volume_center_of_mass: interior.point_data.pos_volume_center_of_mass
    global_params_values: global_data.global_params_values
    global_params_reference: global_data.global_params_reference
    volume_min_max: global_data.volume_min_max

model:
  _target_: physicsnemo.models.domino.DoMINO
  input_features: 3
  output_features_vol: ${out_dim}
  output_features_surf: null
  global_features: 1
  model_parameters:
    activation: gelu
    interp_res: [128, 128, 64]
    use_sdf_in_basis_func: true
    surface_neighbors: false
    num_neighbors_surface: 7
    num_neighbors_volume: 10
    combine_volume_surface: false
    return_volume_neighbors: false
    use_surface_normals: false
    use_surface_area: false
    encode_parameters: false
    geometry_encoding_type: both
    solution_calculation_mode: two-loop
    geometry_rep:
      geo_conv:
        base_neurons: 32
        base_neurons_in: 1
        base_neurons_out: 1
        volume_radii: [0.1, 0.5, 1.0, 2.5]
        surface_radii: [0.01, 0.05, 1.0]
        surface_hops: 1
        volume_hops: 1
        volume_neighbors_in_radius: [32, 64, 128, 256]
        surface_neighbors_in_radius: [8, 16, 128]
        fourier_features: false
        num_modes: 5
        activation: gelu
      geo_processor:
        base_filters: 8
        activation: gelu
        processor_type: conv
        self_attention: false
        cross_attention: false
        surface_sdf_scaling_factor: [0.01, 0.02, 0.04]
        volume_sdf_scaling_factor: [0.04]
    nn_basis_functions:
      base_layer: 512
      fourier_features: true
      num_modes: 5
      activation: gelu
    local_point_conv:
      activation: gelu
    aggregation_model:
      base_layer: 512
      activation: gelu
    position_encoder:
      base_neurons: 512
      activation: gelu
      fourier_features: true
      num_modes: 5
    geometry_local:
      volume_neighbors_in_radius: [64, 128]
      surface_neighbors_in_radius: [32, 128]
      volume_radii: [0.1, 0.25]
      surface_radii: [0.05, 0.25]
      base_layer: 512
    parameter_model:
      base_layer: 512
      fourier_features: false
      num_modes: 5
      activation: gelu

training:
  num_epochs: 1000
  save_interval: 2
  loss_type: mse
  scheduler_update_mode: epoch
  clip_grad: true
  grad_max_norm: 2.0
  optimizer:
    _target_: torch.optim.Adam
    lr: 1.0e-3
    weight_decay: 0.0
    betas: [0.9, 0.999]
    eps: 1.0e-8
  scheduler:
    _target_: torch.optim.lr_scheduler.MultiStepLR
    milestones: [50, 200, 400, 500, 600, 700, 800, 900]
    gamma: 0.5
