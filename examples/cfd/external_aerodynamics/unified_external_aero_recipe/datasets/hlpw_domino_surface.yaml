# HLPW surface dataset for DoMINO.
#
# Cell-centered port of the legacy HLPW DoMINO pipeline
# (``examples/cfd/external_aerodynamics/hlpw_domino``, git sha ``d2eb6cc8``)
# onto the Mesh-native datapipe API.  Mirrors
# ``DoMINODataPipe.process_surface`` (domino_datapipe.py:386-523) step-for-
# step: cell centroids as surface_mesh_centers, face normals, cell areas,
# min-max normalisation of the 3 target fields.
#
# HLPW on disk: ``boundary.points`` is 139M vertices; ``boundary.cells`` is
# 275M triangles; every solution field lives under ``boundary.point_data``
# as ``PROJ(AVG(...))`` (VTK-projected from the solver's cell-native
# output).  This pipeline averages the 3 target point_data fields back to
# cells via ``PointDataToCellData`` (thin wrapper over
# ``Mesh.point_data_to_cell_data``, mesh.py:1462) before any downstream
# processing so the training contract sees cell-native fields matching
# legacy.
#
# Transform chain:
#   1. Inject the AoA scalar as ``global_params_values`` / ``_reference``.
#   2. Crop interior + surface boundary to the volume bbox (legacy
#      ``sample_in_bbox: true``; HLPW surface bbox == volume bbox so the
#      surface crop is a no-op).
#   3. Subsample the surface boundary to ``sampling_resolution`` cells (cells
#      only; points unchanged so indexing into point_data still works).
#   4. Drop unused point_data fields (4 of 7) to bound memory.
#   5. Average the 3 target point_data fields to cell_data via the cell-
#      vertex mean, then drop the originals.
#   6. Non-dimensionalise + rename + min-max normalise the cell fields.
#   7. Compute face normals (store_as=cell_data).
#   8. Lift cell centroids and cell areas into cell_data via
#      LiftCellCentroidsAndAreas so they survive MeshToTensorDict.
#   9. Grid SDF on surface + volume bboxes; point-level SDF on interior
#      (all in the normalised frame -- see D1 fix).
#  10. Positional encodings per cell (surface_target_section=cell_data).
#  11. Rescale every geometry tensor into ``[-1, 1]`` using the bbox corners;
#      emit ``surface_min_max`` / ``volume_min_max``.
#  12. Subsample the STL to ``geom_points_sample=200_000``.
#  13. Terminal MeshToTensorDict + RestructureTensorDict projection to the
#      flat ``input``/``output`` dict the ``domino_hlpw_surface`` collate
#      mapping consumes.
#
# Contract assumption (data-prep side): every .pdmsh file has been written
# with shuffled on-disk point and cell order.  The sampler sanity test
# ``test/datapipes/domino_parity/test_sampler_sanity.py`` guards against
# inadvertent spatial ordering by asserting uniform coverage statistics.

name: hlpw_domino_surface

# Root directory containing ``<case>/domain_<case>.pdmsh`` and
# ``<case>/<case>.stl.pmsh``.  Overridden by the training config's data
# block; default is the HLPW AoA4 dataset on lustre fs1.
train_datadir: /lustre/fs1/portfolios/coreai/projects/coreai_modulus_cae/users/snidhan/HLPW-Benchmarking/data/pmsh/

# HLPW uses the slug-inch-second-Rankine unit system, matching the PR's
# highlift_surface.yaml convention.
metadata:
  U_inf: [2672.95, 0.0, 186.92]   # 2679.505 in/s at AoA=4° (x, y, z)
  p_inf: 176.352                   # 14.696 psi × 12 → slug/(in·s²)
  rho_inf: 1.3756e-6               # 0.002377 slug/ft³ → slug/in³
  T_inf: 518.67                    # [°R]
  L_ref: 1156.75                   # [in] -- span (HLPW reference length)
  AoA: 4.0                          # global angle-of-attack parameter

# Axis-aligned bounding box around the HLPW geometry + wake region.
# Values taken from the legacy hlpw_domino/src/conf/config.yaml.  For
# HLPW the surface and volume bboxes coincide; keeping them as two
# distinct resolvable keys matches the legacy schema (``bounding_box``
# vs ``bounding_box_surface``) and lets downstream models key off either.
bbox:
  volume:
    min: [92.5132,   0.0353,  17.6800]
    max: [2625.9065, 1159.9321, 728.4544]
  surface:
    min: [92.5132,   0.0353,  17.6800]
    max: [2625.9065, 1159.9321, 728.4544]

# DoMINO latent-grid resolution. Preserves the legacy config's value.
grid_resolution: [128, 128, 64]

pipeline:
  reader:
    _target_: ${dp:DomainMeshReader}
    path: ${train_datadir}
    pattern: "**/domain_*.pdmsh"
    # Reader fast-path subsample: interior gets ``sampling_resolution``
    # points (for the interior SDF computation later), and every boundary
    # gets ``sampling_resolution`` cells (the surface training budget).
    # Extra boundaries -- the STL at full resolution -- load after this.
    subsample_n_points: ${sampling_resolution}
    subsample_n_cells: ${sampling_resolution}
    extra_boundaries:
      stl_geometry:
        # HLPW ships one STL per case directory named ``<case>.stl.pmsh``
        # (no ``_single_solid`` suffix).  Keep this loose to match.
        pattern: "*.stl.pmsh"

  # Legacy had no data-augmentation pass; keeping the block empty matches
  # strict legacy faithfulness.

  transforms:
    # Inject the AoA scalar so DoMINO's parameter encoder sees a (1, 1)
    # ``global_params_values`` tensor and the training-time reference
    # (same shape).  Legacy spelled this as ``global_parameters.AoA``.
    - _target_: ${dp:SetGlobalField}
      fields:
        global_params_values:
          - - ${metadata.AoA}
        global_params_reference:
          - - ${metadata.AoA}

    # Legacy ``sample_in_bbox: true`` on the volume interior
    # (domino_datapipe.py l548-559 @ d2eb6cc8).
    - _target_: ${dp:CropMeshToBBox}
      target: interior
      bbox_min: ${bbox.volume.min}
      bbox_max: ${bbox.volume.max}

    # Legacy ``process_surface`` also filters surface boundary cells
    # against the VOLUME bbox (domino_datapipe.py l418-431 @ d2eb6cc8,
    # explicit comment: "this is using the VOLUME bounding box").
    # No-op for HLPW because bbox.surface == bbox.volume.
    - _target_: ${dp:CropMeshToBBox}
      target: boundary
      boundary_name: boundary
      bbox_min: ${bbox.volume.min}
      bbox_max: ${bbox.volume.max}

    # Drop the 4 unused point_data fields before averaging to cells.
    # Keeps the PointDataToCellData conversion bounded to the 3 fields
    # the training contract actually uses.  Broadcasts across interior /
    # boundary / stl_geometry; missing keys are skipped silently.
    - _target_: ${dp:DropMeshFields}
      point_data:
        - PROJ(AVG(RHO))
        - PROJ(AVG(U))
        - PROJ(RMS(P))
        - PROJ(RMS(T))

    # Average the 3 remaining target point_data fields onto cell_data via
    # the cell-vertex mean (``cell_value[c] = point_value[cells[c]].mean()``).
    # HLPW's solver produced these cell-natively but the VTK writer
    # projected them to vertices before storage (fields are named
    # ``PROJ(AVG(...))``).  This wrapper calls the built-in
    # ``Mesh.point_data_to_cell_data`` (mesh.py:1462).
    - _target_: ${dp:PointDataToCellData}
      overwrite_keys: false

    # Drop the original point-stored copies now that cell_data holds the
    # authoritative values.  The built-in preserves point_data after the
    # copy; dropping here bounds peak memory and keeps downstream
    # sections unambiguous.
    - _target_: ${dp:DropMeshFields}
      point_data:
        - PROJ(AVG(T))
        - PROJ(AVG(P))
        - AVG(TAU_WALL)

    # Non-dimensionalize surface fields using freestream metadata.
    # Fields now live on cell_data.
    - _target_: ${dp:NonDimensionalizeByMetadata}
      fields:
        PROJ(AVG(T)): temperature
        PROJ(AVG(P)): pressure
        AVG(TAU_WALL): stress
      section: cell_data

    # Rename to simpler keys that MinMaxNormalizeMeshFields / output/
    # paths expect.
    - _target_: ${dp:RenameMeshFields}
      cell_data:
        PROJ(AVG(T)): temperature
        PROJ(AVG(P)): pressure
        AVG(TAU_WALL): tau_wall

    # Min-max rescale each target to [-1, 1] using dataset-wide per-field
    # min/max.  Matches the legacy HLPW DoMINO contract
    # (``scale_model_targets`` / ``unscale_model_outputs`` in
    # ``physicsnemo/datapipes/cae/domino_datapipe.py``) where the loss
    # operates on targets in [-1, 1].  The stats file is computed on
    # cell-averaged fields; regenerate via::
    #
    #     python src/collect_hlpw_surface_stats.py
    #
    # from the recipe root.  Stats schema: ``{field: {type, min, max}}``.
    - _target_: ${dp:MinMaxNormalizeMeshFields}
      section: cell_data
      stats_file: stats/hlpw_domino_surface_single_aoa_4.pt

    # Face normals (exact per-triangle cross product) stored on cell_data.
    - _target_: ${dp:ComputeSurfaceNormals}
      store_as: cell_data
      field_name: surface_normals

    # Materialize cell centroids and cell areas as explicit cell_data
    # entries so they survive MeshToTensorDict.  Matches the legacy
    # DoMINO ``surface_coordinates`` / ``surface_sizes`` contract.
    - _target_: ${dp:LiftCellCentroidsAndAreas}
      boundary_name: boundary
      centroids_field: cell_centroids
      areas_field: cell_areas

    # Latent-grid SDF on the surface bbox (DoMINO's surf_grid). Legacy
    # computes this in the normalized [-1, 1] frame (domino_datapipe.py
    # l712-727 @ d2eb6cc8); normalize_coords=true stores the normalized
    # grid in global_data.surf_grid directly.
    - _target_: ${dp:ComputeGridSDFFromBoundary}
      boundary_name: stl_geometry
      grid_resolution: ${grid_resolution}
      grid_field: surf_grid
      sdf_field: sdf_surf_grid
      bbox_min: ${bbox.surface.min}
      bbox_max: ${bbox.surface.max}
      normalize_coords: true

    # Latent-grid SDF on the volume bbox (DoMINO's grid). The surface-only
    # model mode doesn't consume this, but legacy computes it unconditionally
    # and some downstream collate mappings reference it -- keep for parity
    # with the combined-mode variant.
    - _target_: ${dp:ComputeGridSDFFromBoundary}
      boundary_name: stl_geometry
      grid_resolution: ${grid_resolution}
      grid_field: grid
      sdf_field: sdf_grid
      bbox_min: ${bbox.volume.min}
      bbox_max: ${bbox.volume.max}
      normalize_coords: true

    # Point-level SDF on interior points (DoMINO's sdf_nodes).  The
    # transform rescales STL vertices + interior query points into
    # ``[-1, 1]`` before the BVH query so the emitted ``sdf`` values
    # live in the normalized frame, matching legacy
    # ``DoMINODataPipe.process_volume`` at domino_datapipe.py:591-630
    # and the scale_sdf(0.04) scaling in model.py:611-614.
    # NormalizeDomainByBBox below does NOT touch interior.point_data so
    # ``sdf`` is not double-normalized.
    - _target_: ${dp:ComputeSDFFromBoundary}
      boundary_name: stl_geometry
      sdf_field: sdf
      normals_field: null
      use_winding_number: true
      bbox_min: ${bbox.volume.min}
      bbox_max: ${bbox.volume.max}

    # DoMINO positional encodings relative to the STL's area-weighted
    # centre of mass.  The COM is computed from unnormalized STL
    # centroids + areas; the ``surface_bbox_*`` kwargs trigger an inline
    # rescale of BOTH operands into ``[-1, 1]`` just before the
    # subtraction, mirroring legacy ``process_surface`` l493-499 @
    # d2eb6cc8.  Surface encoding only for this model mode.
    - _target_: ${dp:ComputeDoMINOPositionalEncodings}
      stl_boundary: stl_geometry
      target_boundary: boundary
      pos_surface_com_field: pos_surface_center_of_mass
      pos_volume_closest_field: pos_volume_closest
      pos_volume_com_field: pos_volume_center_of_mass
      compute_volume_encodings: false
      compute_surface_encodings: true
      # Cell-centered pipeline: emit one encoding per cell centroid
      # (shape ``(N_cells, 3)``) and write it to cell_data.  Pairs with
      # ``surface_mesh_centers: boundaries.boundary.cell_data.cell_centroids``
      # in the RestructureTensorDict input block below.
      surface_target_section: cell_data
      surface_bbox_min: ${bbox.surface.min}
      surface_bbox_max: ${bbox.surface.max}

    # Rescale every geometry tensor into [-1, 1] using legacy HLPW bboxes.
    # Emits surface_min_max / volume_min_max as (2, 3) global_data tensors.
    # The STL boundary stays in world coords (geometry_coordinates is
    # consumed unnormalized, matching legacy process_data output).
    # ``centroids_field`` picks the cell_data entry rescaled on each
    # surface boundary -- cell_centroids needs the surface bbox frame to
    # match interior.points (rescaled with volume bbox) and the SDF.
    - _target_: ${dp:NormalizeDomainByBBox}
      surface_bbox_min: ${bbox.surface.min}
      surface_bbox_max: ${bbox.surface.max}
      volume_bbox_min:  ${bbox.volume.min}
      volume_bbox_max:  ${bbox.volume.max}
      normalize_interior: true
      surface_boundaries: [boundary]
      centroids_field: cell_centroids
      # The synthetic-ball SolutionCalculatorSurface does not consume
      # precomputed kNN neighbours, so there are no neighbour-coord
      # fields to rescale here.
      neighbor_coord_fields: []
      # surf_grid / grid were already stored normalized by
      # ComputeGridSDFFromBoundary with normalize_coords=true; list them
      # as empty here to avoid a double-normalization pass.
      surface_grid_fields: []
      volume_grid_fields: []

    # Sub-sample the STL to legacy ``geom_points_sample=200_000``.
    # Done after everything above so the SDF / COM / positional encodings
    # all use the full STL -- only geometry_coordinates downstream sees
    # the subset.
    - _target_: ${dp:SubsampleNamedBoundary}
      boundary_name: stl_geometry
      n_points: 200000

    # Terminal: Mesh -> TensorDict, then project to the flat
    # ``input/`` / ``output/`` groups that the collate layer maps into
    # DoMINO's ``data_dict`` + ``fields`` contract.
    - _target_: ${dp:MeshToTensorDict}
    - _target_: ${dp:RestructureTensorDict}
      groups:
        input:
          # STL-derived geometry (unnormalized point cloud; legacy parity).
          geometry_coordinates: boundaries.stl_geometry.points
          # Surface-frame global grids (already normalized).
          surf_grid: global_data.surf_grid
          sdf_surf_grid: global_data.sdf_surf_grid
          # Surface boundary tensors on cell centroids (normalized coords):
          # ``surface_mesh_centers`` == cell_centroids; ``surface_normals``
          # are exact face normals; ``surface_areas`` are cell areas;
          # ``pos_surface_center_of_mass`` has one entry per cell.
          surface_mesh_centers: boundaries.boundary.cell_data.cell_centroids
          surface_normals: boundaries.boundary.cell_data.surface_normals
          surface_areas: boundaries.boundary.cell_data.cell_areas
          pos_surface_center_of_mass: boundaries.boundary.cell_data.pos_surface_center_of_mass
          # AoA scalar + reference and the bbox denormalization corners.
          global_params_values: global_data.global_params_values
          global_params_reference: global_data.global_params_reference
          surface_min_max: global_data.surface_min_max
        output:
          temperature: boundaries.boundary.cell_data.temperature
          pressure: boundaries.boundary.cell_data.pressure
          tau_wall: boundaries.boundary.cell_data.tau_wall

targets:
  temperature: scalar
  pressure: scalar
  tau_wall: vector

metrics: [l1, l2, mae]