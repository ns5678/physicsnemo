project:
  name: Boeing_Run_Improved_Model_Architecture
exp_tag: 1
project_dir: outputs/${project.name}/
output: outputs/${project.name}/${exp_tag}
resume_dir: ${output}/models
data_processor:
  kind: boeing_data
  output_dir: /lustre/datasets/HiLiftAeroML-Processed-Big/
  input_dir: /lustre/users/nashton/cadence/HiLiftAeroML/
  cached_dir: /user/cached/drivaer_aws/drivaer_data_full/
  use_cache: false
  num_processors: 36
variables:
  surface:
    solution:
      PROJ(AVG(P)): scalar
      AVG(TAU_WALL(2)): scalar
  volume:
    solution:
      avg(P): scalar
      avg(u): vector
  global_parameters:
    AoA:
      type: scalar
      reference: 22.0
data:
  input_dir: /lustre/datasets/HiLiftAeroML-Processed-Big/train/
  input_dir_val: /lustre/datasets/HiLiftAeroML-Processed-Big/val/
  bounding_box:
    min:
    - 950.0
    - 80.0
    - 16.0
    max:
    - 1900.0
    - 1160.0
    - 500.0
  bounding_box_surface:
    min:
    - 87.78
    - 0.0
    - 16.0
    max:
    - 2800.0
    - 1218.0
    - 765.45
  gpu_preprocessing: true
  gpu_output: true
domain_parallelism:
  domain_size: 1
  shard_grid: false
  shard_points: false
model:
  model_type: combined
  activation: relu
  loss_function:
    loss_type: mse
    area_weighing_factor: 1
  interp_res:
  - 128
  - 128
  - 64
  use_sdf_in_basis_func: true
  positional_encoding: false
  volume_points_sample: 200000
  surface_points_sample: 200000
  surface_sampling_algorithm: area_weighted
  geom_points_sample: 200000
  num_neighbors_surface: 7
  num_neighbors_volume: 10
  combine_volume_surface: false
  return_volume_neighbors: false
  use_surface_normals: true
  use_surface_area: true
  integral_loss_scaling_factor: 100
  normalization: min_max_scaling
  encode_parameters: true
  surf_loss_scaling: 1.0
  vol_loss_scaling: 1.0
  geometry_encoding_type: both
  solution_calculation_mode: two-loop
  resampling_surface_mesh:
    resample: false
    points: 1000000
  geometry_rep:
    geo_conv:
      base_neurons: 32
      base_neurons_in: 1
      base_neurons_out: 1
      volume_radii:
      - 0.1
      - 0.5
      - 1.0
      - 2.5
      surface_radii:
      - 0.01
      - 0.05
      - 1.0
      surface_hops: 1
      volume_hops: 1
      volume_neighbors_in_radius:
      - 10
      - 10
      - 10
      - 10
      surface_neighbors_in_radius:
      - 10
      - 10
      - 10
      fourier_features: false
      num_modes: 5
      activation: ${model.activation}
    geo_processor:
      base_filters: 8
      activation: ${model.activation}
      processor_type: conv
      self_attention: false
      cross_attention: false
  nn_basis_functions:
    base_layer: 512
    fourier_features: true
    num_modes: 5
    activation: ${model.activation}
  local_point_conv:
    activation: ${model.activation}
  aggregation_model:
    base_layer: 512
    activation: ${model.activation}
  position_encoder:
    base_neurons: 512
    activation: ${model.activation}
    fourier_features: true
    num_modes: 5
  geometry_local:
    volume_neighbors_in_radius:
    - 64
    - 128
    surface_neighbors_in_radius:
    - 64
    volume_radii:
    - 0.05
    - 0.1
    surface_radii:
    - 0.1
    base_layer: 512
  parameter_model:
    base_layer: 512
    fourier_features: false
    num_modes: 8
    activation: ${model.activation}
train:
  epochs: 500
  checkpoint_interval: 1
  dataloader:
    batch_size: 1
    pin_memory: false
  sampler:
    shuffle: true
    drop_last: false
  checkpoint_dir: /user/models/
  add_physics_loss: false
val:
  dataloader:
    batch_size: 1
    pin_memory: false
  sampler:
    shuffle: true
    drop_last: false
eval:
  test_path: /lustre/users/snidhan/gtc-dc-demo-2025/testing/test-new/
  save_path: /lustre/users/snidhan/gtc-dc-demo-2025/testing/pred-new/
  checkpoint_name: DoMINO.0.230.pt
  scaling_param_path: /lustre/users/snidhan/gtc-dc-demo-2025/physicsnemo/examples/cfd/external_aerodynamics/domino-boeing-big/src/outputs/Boeing_Run_Improved_Model_Architecture/
  refine_stl: false
  stencil_size: 7
